# validate.yml — CI 拥有穷尽矩阵（hooks 只做快检查）；与本地 pre-push 同一套门禁
# Provenance：蒸馏自 dotnet-deepseek-harness-desktop .github/workflows/ci.yml 的文档门禁面（MIT，2026-09-05）；
# P2 共享层"CI 复验闸"的雏形（主设计 §9.3：跨机器重跑同一套验证，绿了才合入）。
name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # change-scope.sh 需要 fork-point 历史；浅克隆会退化为空集 no-op

      # 门禁清单单源：engine/gates.json（经 scripts/gates.py 发射；tier 的
      # 事件条件步、change-scope 的缺省推导、review-brief 的仅本地语义是
      # 结构性例外，见该脚本头注；第十门禁是白名单外独立件——消费引擎产物，
      # 进白名单会让 solidify 入档中途复算自身，故保留显式行）
      - name: 门禁第一梯队（gates.json 单源 + 白名单外独立件）
        run: |
          python3 scripts/gates.py --run --skip review-tier,review-brief,change-scope
          python3 scripts/verify-gene-format.py
          bash scripts/change-scope.sh

      # 评审档位真强制层（push 事件才有 outgoing base；PR 的 tier 判定由
      # required-review 流程承载——briefs 不入库，brief 闸是本地预发射检查）
      - name: 评审档位（outgoing --enforce）
        if: github.event_name == 'push' && github.event.before != '' && !startsWith(github.event.before, '00000000')
        run: python3 scripts/verify-review-tier.py --enforce --since ${{ github.event.before }}

      - name: self-test 抽查（违约样例必须 FAIL）
        run: |
          python3 scripts/verify-adr-format.py --self-test
          python3 scripts/verify-cookbook.py --self-test
          python3 scripts/verify-skill-format.py --self-test
          python3 scripts/verify-handoff-structure.py --self-test
          python3 scripts/verify-review-tier.py --self-test
          python3 scripts/verify-review-brief.py --self-test
          python3 scripts/verify-gene-format.py --self-test
          python3 scripts/gates.py --self-test

      # 引擎元评测（schema ADR S3）：与 verify-* self-test 平级，不占门禁编号
      - name: engine self-test
        run: node engine/bin.js self-test

      # 适配层元评测（M2 ADR）：零宿主依赖 + 防火墙机器检查（import 面 / 引擎
      # 零第三方依赖 / 插件包结构契约），与 engine self-test 平级
      - name: adapter self-test
        run: node adapters/dsh/selftest.mjs
